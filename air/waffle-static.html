<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Air waffle (static render source)</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;background:#fff}
svg{display:block}
text{font-family:"Times New Roman","Liberation Serif",Times,serif}
.sans{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
</style></head><body>
<!-- Renders the lead chart for the airline story. ?size=post (1080x1350) or ?size=preview (1200x630).
     Values: 2025 annual reports (see data/credit-card-partners-...csv). Each square = $100 million. -->
<svg id="c"></svg>
<script>
var INK='#13241B',G='#007A55',MUTE='#5F7268',EMPTY='#EEF2EF';
var A=[
  {name:'American Airlines',profit:1467,card:6200,x:'4.2'},
  {name:'Delta Air Lines',profit:5822,card:8200,x:'1.4'}
];
var size=new URLSearchParams(location.search).get('size')||'post';
var svg=document.getElementById('c'),out='';
function t(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||20)+'" font-weight="'+(o.fw||400)+'" fill="'+(o.c||INK)+'" text-anchor="'+(o.a||'start')+'"'+(o.cls?' class="'+o.cls+'"':'')+(o.ls?' letter-spacing="'+o.ls+'"':'')+'>'+s+'</text>'}
/* Tiles fill from the bottom row up, left to right; the last tile is filled in proportion.
   Every tile is a card-shaped rectangle; card-partner tiles get a gold chip so they read as credit cards. */
var GOLD='#D9A93B',GOLDL='#F3D27A';
function tile(x,y,w,h,color,chip){
  var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(h*0.16).toFixed(1)+'" fill="'+color+'"/>';
  if(chip){
    var cw=w*0.22,ch=h*0.27,cx=x+w*0.13,cy=y+h*0.30;
    s+='<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" rx="1.6" fill="url(#chip)"/>';
    s+='<rect x="'+(x+w*0.13).toFixed(1)+'" y="'+(y+h*0.74).toFixed(1)+'" width="'+(w*0.5).toFixed(1)+'" height="'+Math.max(1.4,h*0.06).toFixed(1)+'" rx=".7" fill="#fff" opacity=".45"/>';
  }
  return s;
}
function block(x,yBase,val,color,cw,chh,gap,cols,chip){
  var n=val/100,full=Math.floor(n),frac=n-full,s='',tw=cw-gap,th=chh-gap,total=Math.ceil(n);
  for(var i=0;i<total;i++){
    var c=i%cols,r=Math.floor(i/cols),xx=x+c*cw,yy=yBase-(r+1)*chh+gap;
    if(i<full){s+=tile(xx,yy,tw,th,color,chip)}
    else{s+='<rect x="'+xx+'" y="'+yy+'" width="'+tw+'" height="'+th+'" rx="'+(th*0.16).toFixed(1)+'" fill="'+EMPTY+'"/>'+'<rect x="'+xx+'" y="'+yy+'" width="'+(tw*frac).toFixed(1)+'" height="'+th+'" rx="'+(th*0.16).toFixed(1)+'" fill="'+color+'"/>'}
  }
  return {svg:s,rows:Math.ceil(total/cols)};
}
var DEFS='<defs><linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+GOLDL+'"/><stop offset="1" stop-color="'+GOLD+'"/></linearGradient></defs>';
if(size==='post'){
  var W=1080,H=1350;svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
  out+=DEFS+'<rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  out+=t(W/2,92,'Credit Card Partners Paid American Airlines',{fs:50,fw:700,a:'middle'});
  out+=t(W/2,150,'Four Times Its Operating Profit In 2025',{fs:50,fw:700,a:'middle'});
  out+=t(W/2,200,'Cash from co-branded credit card partners vs. operating profit',{fs:23,c:MUTE,a:'middle'});
  /* legend */
  var lx=W/2-250;
  out+=tile(lx-4,229,32,21,INK,false)+t(lx+36,246,'Operating profit',{fs:22});
  out+=tile(lx+231,229,32,21,G,true)+t(lx+271,246,'Paid by credit card partners',{fs:22});
  var cell=48,ch=34,gap=6,cols=9,bw=cols*cell-gap,left=(W-(2*bw+90))/2,right=left+bw+90;
  var bases=[690,1262];
  A.forEach(function(a,i){
    var base=bases[i];
    var p=block(left,base,a.profit,INK,cell,ch,gap,cols,false),c=block(right,base,a.card,G,cell,ch,gap,cols,true);
    var top=base-Math.max(p.rows,c.rows)*ch;
    out+=t(left,top-118,a.name,{fs:34,fw:700});
    out+='<line x1="'+left+'" x2="'+(right+bw)+'" y1="'+(top-100)+'" y2="'+(top-100)+'" stroke="'+INK+'" stroke-width="2"/>';
    var pt=base-p.rows*ch, ct=base-c.rows*ch;
    out+=t(left,pt-46,'$'+(a.profit/1000).toFixed(1)+' billion',{fs:38,fw:700});
    out+=t(left,pt-16,'operating profit',{fs:21,c:MUTE});
    out+=t(right,ct-46,'$'+(a.card/1000).toFixed(1)+' billion',{fs:38,fw:700,c:G});
    out+=t(right,ct-16,'from card partners, '+a.x+'× its profit',{fs:21,c:MUTE});
    out+=p.svg+c.svg;
    out+='<line x1="'+(left-8)+'" x2="'+(right+bw+8)+'" y1="'+(base+4)+'" y2="'+(base+4)+'" stroke="'+INK+'" stroke-width="3"/>';
  });
  /* key: circle the lone card in Delta's top row and label it */
  var kx=right+(cell-gap)/2,ky=bases[1]-Math.ceil(A[1].card/100/cols)*ch+gap+(ch-gap)/2;
  out+='<ellipse cx="'+kx+'" cy="'+ky+'" rx="'+(cell*0.62)+'" ry="'+(ch*0.72)+'" fill="none" stroke="'+GOLD+'" stroke-width="3" transform="rotate(-6 '+kx+' '+ky+')"/>';
  out+='<path d="M'+(kx+cell*0.7)+' '+(ky-2)+' q 26 -14 52 -4" fill="none" stroke="'+GOLD+'" stroke-width="2.5" stroke-linecap="round"/>';
  out+=t(kx+cell*0.7+60,ky+8,'= $100 million',{fs:28,fw:700,c:INK});
  out+=t(W-60,1322,'thenewsindata.com',{fs:18,c:MUTE,a:'end'});
}else{
  var W=1200,H=630;svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
  out+=DEFS+'<rect width="'+W+'" height="'+H+'" fill="#fff"/><rect width="'+W+'" height="10" fill="'+G+'"/>';
  ['Credit Card Partners','Paid American Airlines','Four Times Its','Operating Profit'].forEach(function(l,i){out+=t(64,140+i*66,l,{fs:56,fw:700})});
  out+=t(64,440,'2025. Each tile is $100 million.',{fs:26,c:MUTE});
  out+=tile(60,479,32,21,INK,false)+t(102,497,'Operating profit',{fs:24});
  out+=tile(60,517,32,21,G,true)+t(102,535,'Paid by card partners',{fs:24});
  var cell=46,ch=31,gap=5,cols=10,bw=cols*cell-gap,a=A[0],base=575,px=668,cx=px;
  var c=block(cx,base,a.card,G,cell,ch,gap,cols,true),p=block(cx,base-c.rows*ch-92,a.profit,INK,cell,ch,gap,cols,false);
  out+=t(cx,base-c.rows*ch-16,'$6.2B from card partners',{fs:30,fw:700,c:G});
  out+=t(cx,base-c.rows*ch-92-p.rows*ch-14,'$1.5B operating profit',{fs:30,fw:700});
  out+=c.svg+p.svg;
  out+=t(W-48,600,'thenewsindata.com',{fs:20,c:MUTE,a:'end'});
}
svg.innerHTML=out;
</script></body></html>
