<!doctype html><html><head><meta charset="utf-8"><title>aging lab</title><meta name="robots" content="noindex">
<style>body{font:14px Georgia,serif;margin:20px}pre{white-space:pre-wrap}</style></head><body>
<h3>Presidential aging lab</h3><pre id="log">loading…</pre>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const P=[
 ['nixon','Richard Nixon',[1967,1968,1969,1970,1971,1972,1973,1974],1,'1913-01-09','1969-01-20','1974-08-09'],
 ['ford','Gerald Ford',[1973,1974,1975,1976,1977],2,'1913-07-14','1974-08-09','1977-01-20'],
 ['carter','Jimmy Carter',[1976,1977,1978,1979,1980,1981],2,'1924-10-01','1977-01-20','1981-01-20'],
 ['reagan','Ronald Reagan',[1980,1981,1982,1983,1984,1985,1986,1987,1988,1989],2,'1911-02-06','1981-01-20','1989-01-20'],
 ['bush41','George H. W. Bush',[1988,1989,1990,1991,1992,1993],2,'1924-06-12','1989-01-20','1993-01-20'],
 ['clinton','Bill Clinton',[1992,1993,1994,1995,1996,1997,1998,1999,2000,2001],2,'1946-08-19','1993-01-20','2001-01-20'],
 ['bush43','George W. Bush',[2000,2001,2002,2003,2004,2005,2006,2007,2008,2009],2,'1946-07-06','2001-01-20','2009-01-20'],
 ['obama','Barack Obama',[2008,2009,2010,2011,2012,2013,2014,2015,2016,2017],2,'1961-08-04','2009-01-20','2017-01-20'],
 ['trump','Donald Trump',[2016,2017,2018,2019,2020,2021,2024,2025,2026],2,'1946-06-14','2017-01-20','2021-01-20|2025-01-20|2029-01-20'],
 ['biden','Joe Biden',[2020,2021,2022,2023,2024,2025],2,'1942-11-20','2021-01-20','2025-01-20'],
 ['fordB','Gerald Ford',[1974,1975,1976],3],['bush41B','George H. W. Bush',[1989,1990,1991,1992],3],['trumpB','Donald Trump',[2017,2018,2019,2020,2025,2026],3],['bidenB','Joe Biden',[2021,2022,2023,2024],3]];
const CAP=500;
const log=t=>{document.getElementById('log').textContent=t};
const API=async p=>{for(let k=0;k<4;k++){try{return await fetch('https://commons.wikimedia.org/w/api.php?format=json&origin=*&'+new URLSearchParams(p)).then(r=>r.json())}catch(e){await new Promise(r=>setTimeout(r,3000))}}return {}};
async function listFiles(cat,depth,acc,seenC){if(seenC.has(cat))return;seenC.add(cat);let cont=null;do{const p={action:'query',list:'categorymembers',cmtitle:cat,cmlimit:500,cmtype:'file|subcat'};if(cont)p.cmcontinue=cont;const j=await API(p);const mem=(j.query&&j.query.categorymembers)||[];for(const m of mem){if(m.ns===14){if(depth>0&&!/video|audio|document|signature|map/i.test(m.title))await listFiles(m.title,depth-1,acc,seenC)}else if(/\.(jpe?g|png)$/i.test(m.title))acc.add(m.title)}cont=j.continue&&j.continue.cmcontinue}while(cont)}
const MON={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function pdate(s){s=(s||'').toLowerCase().replace(/<[^>]+>/g,' ');let m=s.match(/(19[0-9]\d|20[0-2]\d)[-:\/](\d\d)[-:\/](\d\d)/);if(m)return +m[1]+(+m[2]-1)/12+(+m[3]-1)/365;m=s.match(/(\d{1,2})\s+([a-z]+)\s+(19\d\d|20[0-2]\d)/);if(m&&MON[m[2]])return +m[3]+(MON[m[2]]-1)/12+(+m[1]-1)/365;m=s.match(/([a-z]+)\s+(\d{1,2}),?\s+(19\d\d|20[0-2]\d)/);if(m&&MON[m[1]])return +m[3]+(MON[m[1]]-1)/12+(+m[2]-1)/365;m=s.match(/([a-z]+)\s+(19\d\d|20[0-2]\d)/);if(m&&MON[m[1]])return +m[2]+(MON[m[1]]-1)/12+.04;return null}
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';const to=setTimeout(()=>rej('to'),30000);i.onload=()=>{clearTimeout(to);res(i)};i.onerror=()=>{clearTimeout(to);rej('err')};i.src=u});
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){log('storage error '+e)}};
async function ref(name){const j=await fetch('https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles='+encodeURIComponent(name)).then(r=>r.json());const pg=Object.values(j.query.pages)[0];const im=await loadImg(pg.thumbnail.source);const d=await faceapi.detectSingleFace(im).withFaceLandmarks().withFaceDescriptor();return Array.from(d.descriptor)}
async function run(){
 await faceapi.nets.ssdMobilenetv1.loadFromUri(M);await faceapi.nets.ageGenderNet.loadFromUri(M);await faceapi.nets.faceLandmark68Net.loadFromUri(M);await faceapi.nets.faceRecognitionNet.loadFromUri(M);
 const only=new URLSearchParams(location.search).get('p');
 for(const [key,name,years,depth] of P){ if(only&&only!==key)continue;
  let st=get('ag_'+key+'_st')||{};
  if(st.phase==='done')continue;
  if(!st.ref){st.ref=await ref(name);put('ag_'+key+'_st',st)}
  if(!st.items){log(key+': listing…');const per={};for(const y of years){const acc=new Set();await listFiles('Category:'+name+' in '+y,depth,acc,new Set());per[y]=[...acc];log(key+': listed '+y+' '+acc.size)}
   const cap=Math.ceil(CAP/years.length);let titles=[];for(const y of years){const a=per[y].sort(()=>Math.random()-.5).slice(0,cap);titles.push(...a.map(t=>[t,y]))}titles.sort(()=>Math.random()-.5);
   const items=[];for(let i=0;i<titles.length;i+=40){const b=titles.slice(i,i+40);const j=await API({action:'query',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:640,titles:b.map(x=>x[0]).join('|')});const yr=Object.fromEntries(b);for(const p of Object.values((j.query&&j.query.pages)||{})){const ii=p.imageinfo&&p.imageinfo[0];if(!ii)continue;const m=ii.extmetadata||{};const d=pdate((m.DateTimeOriginal||{}).value);items.push([ii.thumburl||ii.url,d?+d.toFixed(3):null,yr[p.title],p.title.slice(5,80)])}log(key+': meta '+items.length)}
   st.items=items;st.i=0;st.res=[];put('ag_'+key+'_st',st)}
  if(key==='nixon'&&st.items&&!st.lim){const done=st.items.slice(0,st.i),rest=st.items.slice(st.i).filter(x=>x[2]>=1971).sort(()=>Math.random()-.5);st.items=done.concat(rest);st.lim=st.i+250;put('ag_'+key+'_st',st)}
  const R=new Float32Array(st.ref);const LIM=st.lim||st.items.length;
  while(st.i<Math.min(LIM,st.items.length)){const [u,d,y,t]=st.items[st.i];try{const im=await loadImg(u);const ds=await faceapi.detectAllFaces(im,new faceapi.SsdMobilenetv1Options({minConfidence:0.5})).withFaceLandmarks().withFaceDescriptors().withAgeAndGender();let b=null;for(const f of ds){const dist=faceapi.euclideanDistance(f.descriptor,R);if(!b||dist<b[0])b=[dist,f.age,f.detection.box.width,ds.length]}if(b&&b[0]<0.6)st.res.push([st.i,d,y,+b[1].toFixed(1),+b[0].toFixed(3),Math.round(b[2]),b[3]])}catch(e){}
   st.i++;if(st.i%10==0||st.i===LIM){put('ag_'+key+'_st',st);log(key+' '+st.i+'/'+Math.min(LIM,st.items.length)+' matched '+st.res.length+' tensors '+faceapi.tf.memory().numTensors)}}
  st.phase='done';st.n=st.items.length;delete st.items;put('ag_'+key+'_st',st)}
 log('ALL DONE')}
run().catch(e=>log('ERROR '+e));
</script></body></html>
