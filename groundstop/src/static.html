<!doctype html><meta charset="utf-8"><title>static</title>
<style>
html,body{margin:0;background:#fff}
body{font-family:"Times New Roman",Times,"Liberation Serif",serif;color:#13241b}
.wrap{padding:26px 40px 0}
h1{font-size:46px;line-height:1.05;margin:0 0 8px;text-align:center}
.sub{font-size:21px;font-style:italic;color:#4a5550;text-align:center;margin:0 0 18px}
#nid-gs{max-width:none!important;margin:0!important}
#nid-gs .ti,#nid-gs .su,#nid-gs .leg,#nid-gs .unk,#nid-gs .ctl,#nid-gs .chips{display:none!important}
#nid-gs .row{cursor:default}
body.lead #nid-gs{display:grid;grid-template-columns:1fr 1.12fr;column-gap:28px;align-items:start;font-size:17px}
body.lead #nid-gs .rows{grid-column:1;grid-row:1}body.lead #nid-gs .axis{grid-column:1;grid-row:2}body.lead #nid-gs .facts{grid-column:1;grid-row:3;margin-top:14px;grid-template-columns:repeat(3,1fr)}
body.lead #nid-gs .stage{grid-column:2;grid-row:1/span 4;margin-top:0}
body.lead #nid-gs .row{grid-template-columns:150px 1fr}body.lead #nid-gs .axis{grid-template-columns:150px 1fr}
body.lead #nid-gs .cap{display:none}body.lead #nid-gs .clock{font-size:34px}
body.lead #nid-gs .fact b{font-size:1.45em}body.lead #nid-gs .fact span{font-size:.82em}
body.tall .wrap{padding:36px 44px 0}body.tall h1{font-size:43px}body.tall .sub{font-size:27px;margin-bottom:26px}
body.tall #nid-gs{font-size:24px}body.tall #nid-gs .track{height:44px}body.tall #nid-gs .bar{height:28px;top:7px}body.tall #nid-gs .row{grid-template-columns:270px 1fr;padding:10px 16px}body.tall #nid-gs .axis{grid-template-columns:270px 1fr}
body.tall #nid-gs .clock{font-size:60px}body.tall #nid-gs .pill{font-size:17px;padding:8px 16px}body.tall #nid-gs .stat{font-size:22px}body.tall #nid-gs .cap,body.tall #nid-gs .facts{display:none}body.tall #nid-gs .stage{margin-top:10px}
body.tall #nid-gs .facts{grid-template-columns:repeat(3,1fr);margin-top:24px}
</style>
<body><div class="wrap"><h1>The Three Times The U.S. Grounded Every Flight</h1>
<p class="sub">When each nationwide ground stop began and how long it ran on its first day, Eastern time. The map shows Nov. 13, 2026 at 5 p.m.</p>
