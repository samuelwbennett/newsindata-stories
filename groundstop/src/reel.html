<body>
<div class="abs brand"><span>The News in Data</span></div>
<div class="abs kick">TRENDING · AVIATION</div>
<div class="abs title">The Three Times The U.S.<br>Grounded Every Flight</div>
<div class="abs sub">Each plane is about 25 aircraft, placed for illustration. Times are Eastern.</div>
<div id="wrap"><div class="poster" id="nid-gs-home"><a href="#"></a></div></div>
<div class="abs" id="stat"></div>
<div class="rule"></div><div class="src">Sources: FAA, FlightAware, TheStreet. As of 5 p.m. ET, Nov. 13, 2026</div><div class="site">thenewsindata.com</div>
<div class="abs band">Charts that explain the news, since 2016</div>
<script src="../embed.js"></script>
<script>
var C01=[[9.483,5102],[9.75,4546],[10.25,2803],[10.65,1693],[11.1,1305],[12.267,0]];
function ip(t){if(t<=C01[0][0])return C01[0][1];for(var i=1;i<C01.length;i++)if(t<=C01[i][0]){var a=C01[i-1],b=C01[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0])}return 0}
function dur(h){var m=Math.round(h*60);return (m>=60?Math.floor(m/60)+" hr ":"")+(m%60)+" min"}
function ease(x){return x<0?0:x>1?1:x}
/* scenes: [key,t0,t1,play seconds,hold seconds] */
var SC=[["e2001",9.0,12.45,7.5,1.2],["e2023",6.9,10.3,4.5,0.6],["e2026",14.7,17.0,6.0,2.6]];
window.sceneLen=function(i){return SC[i][3]+SC[i][4]};
window.frame=function(i,sec){var s=SC[i],u=ease(sec/s[3]),t=s[1]+(s[2]-s[1])*u,el=document.getElementById("nid-gs-home"),st=document.getElementById("stat");
  el._nidgs.go(s[0],t);
  if(s[0]==="e2001")st.innerHTML=t>=9.483?"<b>"+Math.round(ip(t)).toLocaleString("en-US")+"</b> aircraft in the air":"A normal Tuesday morning";
  else if(s[0]==="e2023")st.innerHTML=t<7.5?"A system failure overnight":t<9?"Departures paused for <b>"+dur(t-7.5)+"</b>":"The stop lasted <b>about 90 min</b>";
  else st.innerHTML=t<15.9?"A Friday afternoon":(sec>s[3]+0.5?"The only one of the three to <b>begin after noon</b>":"Stopped for <b>"+dur(t-15.9)+"</b> and counting")};
</script>
